name: Build Android APK
on: workflow_dispatch
defaults:
  run:
    working-directory: hot-wheels-hunt-book-open-source
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project
        working-directory: .
        run: for z in *.zip; do unzip -q -o "$z"; done
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
    
      - name: Install Android SDK pieces
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: bun install
      - run: bun run build:android
      - run: node scripts/prepare-android.mjs
      - name: Build debug APK
        working-directory: hot-wheels-hunt-book-open-source/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hot-wheels-hunt-book-apk
          path: hot-wheels-hunt-book-open-source/android/app/build/outputs/apk/debug/app-debug.apk

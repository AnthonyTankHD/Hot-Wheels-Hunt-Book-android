name: Build Android APK
on: workflow_dispatch
permissions:
  contents: write
defaults:
  run:
    working-directory: hot-wheels-hunt-book-open-source
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project
        working-directory: .
        run: for z in *.zip; do unzip -q -o "$z"; done
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
    
      - name: Install Android SDK pieces
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: bun install
      - run: bun run build:android
      - run: node scripts/prepare-android.mjs
      - name: Build debug APK
        working-directory: hot-wheels-hunt-book-open-source/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hot-wheels-hunt-book-apk
          path: hot-wheels-hunt-book-open-source/android/app/build/outputs/apk/debug/app-debug.apk

      # Publish a GitHub Release so the app can update itself (Settings ->
      # Check GitHub for updates). The tag is the build stamp from
      # client/src/build-stamp.ts, so bump it in every new build.
      - name: Pack the in-app update bundle
        run: node scripts/make-ota-bundle.mjs "$GITHUB_WORKSPACE/bundle.json"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAMP=$(grep -oP 'SPLASH_BUILD_STAMP = "\K[^"]+' client/src/build-stamp.ts)
          SHELL_V=$(grep -oP 'SHELL_VERSION = \K[0-9]+' client/src/build-stamp.ts)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"
          cd "$GITHUB_WORKSPACE"
          gh release delete "$STAMP" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$STAMP" app-debug.apk bundle.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "$STAMP" \
            --notes "shell=$SHELL_V"
